[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-analyzer"
version = "0.1.0"
description = "Desktop XRD peak fitting and reporting tool for PZT thin-film analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15.0",
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "matplotlib>=3.4.0",
  "pandas>=1.3.0",
  "lmfit>=1.0.3",
  "openpyxl>=3.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
xrd-analyzer = "xrd_gui:main"
xrd-plot-results = "plot_from_excel:main"

[project.urls]
Repository = "https://github.com/ShawnWolgu/xrd-analyzer"

[tool.setuptools]
py-modules = [
  "convert_csv_to_txt",
  "plot_from_excel",
  "xrd_analyzer",
  "xrd_gui",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "scientific: tests for numerical or physical behavior",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Begin with correctness checks that the legacy source can satisfy. Expand during extraction.
select = ["E9", "F63", "F7", "F82"]
