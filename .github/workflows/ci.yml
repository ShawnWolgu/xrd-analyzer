name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/xrd-analyzer-matplotlib
      QT_QPA_PLATFORM: offscreen
      XDG_CACHE_HOME: /tmp/xrd-analyzer-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Check critical Python errors
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
